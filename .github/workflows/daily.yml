name: Daily AI Commit

on:
  schedule:
    - cron: "0 9 * * *"  # runs every day at 9 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-ai:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Clean old Google AI packages
        run: |
          python -m pip uninstall -y google-generativeai || true
          pip uninstall -y google-generativeai || true

      - name: Install Gemini SDK (official)
        run: |
          python -m pip install --upgrade google-genai

      - name: Run AI Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_ai.py

      - name: Commit and Push
        run: |
          git config --global user.name "Tanvir-Hossain847"
          git config --global user.email "tanvirhossaintufa@gmail.com"
          git add .
          git commit -m "Daily file update" || echo "No changes to commit"
          git push
